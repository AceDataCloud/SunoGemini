name: Extension checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Contract and archive checks
        run: python3 -m unittest discover -s tests
      - name: Build extension archive
        run: python3 scripts/package_extension.py --output /tmp/suno-by-ace-data-cloud.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: suno-by-ace-data-cloud
          path: /tmp/suno-by-ace-data-cloud.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime-test dependency
        run: python3 -m pip install pexpect==4.9.0
      - name: Download pinned official Gemini CLI
        run: |
          curl -fsSL https://github.com/google-gemini/gemini-cli/releases/download/v0.64.0/gemini-cli-bundle.zip -o /tmp/gemini-cli.zip
          echo '9d4ad33d15dcf35098919c69eb9d98b6dc640567f141d6fc4f8f053c8cbd8dae  /tmp/gemini-cli.zip' | sha256sum -c -
          python3 -m zipfile -e /tmp/gemini-cli.zip /tmp/gemini-cli
      - name: Native extension lifecycle without paid calls
        run: python3 tests/smoke_extension.py --cli /tmp/gemini-cli/gemini.js --output /tmp/suno-native-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-extension-check
          path: /tmp/suno-native-check.json
      - name: Remote review-commit installation without a Key
        run: python3 tests/smoke_remote_install.py --cli /tmp/gemini-cli/gemini.js --ref "${{ github.event.pull_request.head.sha || github.sha }}" --output /tmp/suno-remote-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remote-install-check
          path: /tmp/suno-remote-check.json
